name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel any in-progress run for the same branch / PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Treat every rustc warning and every clippy lint as an error.
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  check:
    name: Check (fmt + clippy + doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # SHA-pinned; toolchain set explicitly because the action otherwise
      # derives it from the git ref, which is gone once we pin to a SHA.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        # --all-targets covers lib, bins, examples, tests, and benchmarks.
        # --all-features additionally builds `test-support`, which is a different code path
        # from the `cfg(test)` one and is what downstream consumers actually compile. It also
        # pulls in examples gated behind `required-features`.
        run: cargo clippy --all-targets --all-features

      - name: cargo doc
        # Matches docs.rs, which builds with all-features (see package.metadata.docs.rs).
        # Without this a broken link in feature-gated code fails the publish, not the PR.
        run: cargo doc --no-deps --all-features

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Separate cache key so wasm artefacts don't pollute the native build cache.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: wasm32

      - name: cargo check (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Both configurations are needed: `test_support` compiles under `cfg(test)` whether or
      # not the feature is on, and each build activates dependencies the other does not.
      - name: cargo test
        run: cargo test --features test-support

      - name: cargo test (all features)
        run: cargo test --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"

      # Separate cache key so the MSRV build artefacts don't pollute the
      # stable build cache and vice-versa.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: msrv-1.88

      - name: cargo test
        run: cargo test --features test-support

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Separate cache key: instrumented artefacts are not the test job's.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: coverage

      # Prebuilt binary; `cargo install` would take minutes per run.
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov

      # all-features so the test-support server and the e2e tests count. The floor is a
      # fair way under where the crate sits, so only a real drop fails the PR.
      - name: cargo llvm-cov
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 90

      - name: coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            cargo llvm-cov report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lcov
          path: lcov.info
          retention-days: 14
